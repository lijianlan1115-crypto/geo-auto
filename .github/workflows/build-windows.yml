name: Build and verify Windows client

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified ZIP as a GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag used when publish_release is enabled
        required: false
        type: string
        default: windows-v0.1.18
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python_service/requirements.txt
            python_service/requirements-build.txt

      - name: Install Python dependencies
        working-directory: python_service
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Install bundled OCR runtime
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $tesseract = "C:\Program Files\Tesseract-OCR\tesseract.exe"
          if (-not (Test-Path $tesseract)) { throw "Chocolatey did not install tesseract.exe" }
          $tessdata = Join-Path (Split-Path $tesseract) "tessdata"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_sim.traineddata" `
            -OutFile (Join-Path $tessdata "chi_sim.traineddata")
          (Split-Path $tesseract) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate extension and Python syntax
        shell: pwsh
        run: |
          node -e "JSON.parse(require('fs').readFileSync('chrome_extension/manifest.json','utf8')); console.log('manifest ok')"
          python -m compileall -q python_service
          python python_service/windows_smoke_test.py --expect-tesseract

      - name: Build Windows desktop application
        working-directory: python_service
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --hidden-import sqlite3 `
            --hidden-import _sqlite3 `
            --collect-all openpyxl `
            --collect-all PIL `
            --collect-all pytesseract `
            --name "GEO反馈自动化" `
            --distpath . `
            --workpath build `
            --specpath build `
            desktop_app.py

      - name: Assemble customer package
        shell: pwsh
        run: |
          $package = "release/GEO反馈自动化_Windows"
          New-Item -ItemType Directory -Force -Path "$package/python_service" | Out-Null
          Copy-Item "python_service/GEO反馈自动化.exe" "$package/python_service/"

          $tesseract = (Get-Command tesseract.exe -ErrorAction Stop).Source
          Copy-Item (Split-Path $tesseract) "$package/python_service/Tesseract-OCR" -Recurse

          Copy-Item chrome_extension "$package/chrome_extension" -Recurse
          Copy-Item 使用说明.md "$package/"
          Copy-Item WINDOWS_DEPLOY.md "$package/"
          Copy-Item start_windows_exe.bat "$package/启动GEO自动化.bat"

          $env:GEO_PROJECT_DIR = (Resolve-Path $package).Path
          python python_service/create_test_excel.py
          Move-Item "$package/input.xlsx" "$package/input_template.xlsx" -Force
          Remove-Item "$package/output" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Smoke-test packaged EXE
        shell: pwsh
        run: |
          $package = (Resolve-Path "release/GEO反馈自动化_Windows").Path
          Copy-Item "$package/input_template.xlsx" "$package/input.xlsx" -Force
          $exe = Join-Path $package "python_service/GEO反馈自动化.exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            $healthy = $false
            foreach ($attempt in 1..45) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 2
                if ($health.ok) { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) {
              $log = Join-Path $package "output/service.log"
              if (Test-Path $log) { Get-Content $log -Tail 200 }
              throw "Packaged EXE did not expose a healthy local service"
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Remove-Item "$package/input.xlsx" -Force -ErrorAction SilentlyContinue
            Remove-Item "$package/output" -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Create verified ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "release/GEO反馈自动化_Windows" `
            -DestinationPath "release/GEO反馈自动化_Windows.zip" `
            -CompressionLevel Optimal `
            -Force
          $hash = (Get-FileHash "release/GEO反馈自动化_Windows.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  GEO反馈自动化_Windows.zip" | Set-Content "release/GEO反馈自动化_Windows.zip.sha256" -Encoding ascii

      - name: Upload verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GEO反馈自动化_Windows
          path: |
            release/GEO反馈自动化_Windows.zip
            release/GEO反馈自动化_Windows.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish customer download release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" `
            "release/GEO反馈自动化_Windows.zip" `
            "release/GEO反馈自动化_Windows.zip.sha256" `
            --target "${{ github.sha }}" `
            --title "GEO反馈自动化 Windows 客户版" `
            --notes "Windows 客户包已通过 Python、OCR、Excel 内嵌图片及打包后 EXE 健康检查。解压后双击 启动GEO自动化.bat。"
